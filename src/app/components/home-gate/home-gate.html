<div class="min-h-screen bg-[#0f172a] text-slate-200 p-8 md:p-20">
  <header class="max-w-5xl mx-auto mb-16">
    <h1 class="text-5xl font-black text-white tracking-tight">
      {{ 'about.name' | translate }}
    </h1>
    <p class="text-xl text-blue-400 mt-2 font-medium">
      {{ 'about.title' | translate }}
    </p>
    <p class="text-slate-500 mt-4 max-w-xl">
      {{ 'home.subtitle' | translate }}
    </p>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto">
    @for (theme of themes; track theme.id) {
      <button
        (click)="goToTheme(theme.id)"
        class="cursor-pointer group p-8 rounded-2xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 hover:border-blue-500/50 transition-all text-left relative overflow-hidden"
      >
        <span
          class="absolute -right-4 -bottom-4 text-8xl opacity-5 group-hover:opacity-10 transition-opacity grayscale group-hover:grayscale-0"
        >
          {{ theme.icon }}
        </span>

        <div class="relative z-10">
          <div
            class="text-3xl mb-4 transform group-hover:scale-110 transition-transform duration-300"
          >
            {{ theme.icon }}
          </div>

          <h3 class="text-2xl font-bold text-white group-hover:text-blue-400 transition-colors">
            {{ 'themes_data.' + theme.id + '.title' | translate }}
          </h3>

          <p class="text-slate-400 mt-2 text-sm leading-relaxed max-w-[80%]">
            {{ 'themes_data.' + theme.id + '.description' | translate }}
          </p>

          <div
            class="mt-6 flex items-center text-xs font-bold text-blue-500 uppercase tracking-widest opacity-0 group-hover:opacity-100 transform translate-x-[-10px] group-hover:translate-x-0 transition-all"
          >
            View Demo →
          </div>
        </div>
      </button>
    }
  </div>
</div>
