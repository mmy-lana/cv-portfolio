<div 
  class="min-h-screen p-6 md:p-16 relative overflow-hidden font-sans transition-colors duration-300"
  [class.bg-[#070913]]="themeService.isDarkMode()"
  [class.text-slate-200]="themeService.isDarkMode()"
  [class.bg-[#f8fafc]]="!themeService.isDarkMode()"
  [class.text-slate-800]="!themeService.isDarkMode()"
>
  <app-global-navbar />

  <!-- DASHBOARD GRID CONTENT -->
  <main class="max-w-6xl mx-auto pt-10">
    <div class="mb-8 flex items-center justify-between">
      <p 
        class="text-xs font-bold uppercase tracking-widest transition-colors"
        [class.text-slate-400]="themeService.isDarkMode()"
        [class.text-slate-500]="!themeService.isDarkMode()"
      >
        Select a theme preset to preview layout architecture ({{ themes.length }} presets)
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (theme of themes; track theme.id) {
        <a
          [routerLink]="['/', theme.id]"
          (mouseenter)="onMouseEnter(theme.id)"
          (mouseleave)="onMouseLeave()"
          (mousemove)="onCardMouseMove($event)"
          class="home-theme-card group p-8 rounded-2xl border text-left relative overflow-hidden cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl block outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 focus-visible:scale-[1.02]"
          [class.focus-visible:ring-offset-[#070913]]="themeService.isDarkMode()"
          [class.focus-visible:ring-offset-[#f8fafc]]="!themeService.isDarkMode()"
          [class.border-slate-800/80]="themeService.isDarkMode()"
          [class.bg-slate-900/40]="themeService.isDarkMode()"
          [class.hover:bg-slate-900/80]="themeService.isDarkMode()"
          [class.focus-visible:bg-slate-900]="themeService.isDarkMode()"
          [class.border-slate-200]="!themeService.isDarkMode()"
          [class.bg-white]="!themeService.isDarkMode()"
          [class.hover:bg-slate-50]="!themeService.isDarkMode()"
          [class.focus-visible:bg-slate-50]="!themeService.isDarkMode()"
          [attr.data-theme-id]="theme.id"
        >
          <!-- WATERMARK BACKGROUND ICON -->
          <div 
            class="absolute -right-6 -bottom-6 opacity-5 group-hover:opacity-15 group-hover:scale-115 group-hover:-rotate-6 transition-all duration-500 pointer-events-none select-none"
            [class.text-white]="themeService.isDarkMode()"
            [class.text-slate-900]="!themeService.isDarkMode()"
          >
            <app-cv-icon [name]="theme.iconName" size="w-32 h-32" />
          </div>

          <div class="relative z-10 space-y-5">
            <!-- TOP ICON BADGE + FLOATING PRESET TAG -->
            <div class="flex items-center justify-between">
              <div 
                class="w-11 h-11 rounded-2xl flex items-center justify-center border transition-all duration-300 ease-out group-hover:-translate-y-1.5 group-hover:scale-110 shadow-sm group-hover:shadow-lg"
                [class.bg-slate-800/80]="themeService.isDarkMode()"
                [class.border-slate-700/80]="themeService.isDarkMode()"
                [class.text-cyan-400]="themeService.isDarkMode()"
                [class.bg-slate-100]="!themeService.isDarkMode()"
                [class.border-slate-200]="!themeService.isDarkMode()"
                [class.text-blue-600]="!themeService.isDarkMode()"
              >
                <app-cv-icon [name]="theme.iconName" size="w-5 h-5" />
              </div>

              <div class="transform transition-all duration-300 ease-out group-hover:-translate-y-1">
                <app-cv-preset-badge [themeId]="theme.id" [showPrefix]="false" />
              </div>
            </div>

            <div>
              <h3 
                class="text-xl font-bold transition-colors"
                [class.text-white]="themeService.isDarkMode()"
                [class.group-hover:text-blue-400]="themeService.isDarkMode()"
                [class.group-focus-visible:text-blue-400]="themeService.isDarkMode()"
                [class.text-slate-900]="!themeService.isDarkMode()"
                [class.group-hover:text-blue-600]="!themeService.isDarkMode()"
                [class.group-focus-visible:text-blue-600]="!themeService.isDarkMode()"
              >
                {{ 'themes_data.' + theme.id + '.title' | translate }}
              </h3>

              <p 
                class="mt-2 text-xs leading-relaxed transition-colors"
                [class.text-slate-400]="themeService.isDarkMode()"
                [class.text-slate-600]="!themeService.isDarkMode()"
              >
                {{ 'themes_data.' + theme.id + '.description' | translate }}
              </p>
            </div>

            <div 
              class="pt-2 flex items-center text-xs font-bold uppercase tracking-widest group-hover:translate-x-1 group-focus-visible:translate-x-1 transition-transform"
              [class.text-blue-400]="themeService.isDarkMode()"
              [class.text-blue-600]="!themeService.isDarkMode()"
            >
              <span>EXPLORE THEME</span>
              <span class="ml-1.5">→</span>
            </div>
          </div>
        </a>
      }
    </div>
  </main>
</div>
