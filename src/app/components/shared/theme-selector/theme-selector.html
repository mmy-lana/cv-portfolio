<div class="relative inline-block text-left z-50">
  <button
    (click)="toggleDropdown()"
    class="h-9 px-3.5 rounded-xl border text-xs font-bold transition-all cursor-pointer flex items-center gap-2 select-none"
    [class.bg-slate-900]="themeService.isDarkMode()"
    [class.border-slate-800]="themeService.isDarkMode()"
    [class.text-white]="themeService.isDarkMode()"
    [class.hover:bg-slate-800]="themeService.isDarkMode()"
    [class.bg-slate-100]="!themeService.isDarkMode()"
    [class.border-slate-200]="!themeService.isDarkMode()"
    [class.text-slate-800]="!themeService.isDarkMode()"
    [class.hover:bg-slate-200]="!themeService.isDarkMode()"
    aria-label="Switch Theme Panel"
  >
    <app-cv-icon name="arrow-right" size="w-3.5 h-3.5" class="transition-transform" [class.rotate-90]="position === 'down'" [class.-rotate-90]="position === 'up'" />
    <span>{{ 'home.explore' | translate }}</span>
    <span>{{ themeService.themes.find(t => t.id === themeService.currentTheme())?.icon || '🎨' }}</span>
  </button>

@if (isOpen()) {
    <div
      class="absolute w-72 rounded-2xl border border-white/10 bg-slate-950/95 p-4 shadow-2xl backdrop-blur-xl ring-1 ring-black/20 focus:outline-none z-50 animate-fade-in-up duration-200"
      [class.top-full]="position === 'down'"
      [class.mt-2]="position === 'down'"
      [class.bottom-full]="position === 'up'"
      [class.mb-2]="position === 'up'"
      [class.right-0]="align === 'right'"
      [class.origin-top-right]="position === 'down' && align === 'right'"
      [class.origin-bottom-right]="position === 'up' && align === 'right'"
      [class.left-0]="align === 'left'"
      [class.origin-top-left]="position === 'down' && align === 'left'"
      [class.origin-bottom-left]="position === 'up' && align === 'left'"
      role="menu"
      aria-orientation="vertical"
      aria-labelledby="menu-button"
    >
      <div class="mb-3 px-2">
        <p class="text-xs font-bold uppercase tracking-widest text-slate-400">
          {{ 'home.title' | translate }}
        </p>
        <p class="text-[11px] text-slate-500 mt-0.5">
          {{ 'home.subtitle' | translate }}
        </p>
      </div>

      <div class="grid grid-cols-1 gap-1 max-h-80 overflow-y-auto pr-1">
        @for (theme of themeService.themes; track theme.id) {
          <button
            (click)="selectTheme(theme)"
            class="group w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-left text-sm font-medium transition-all duration-200"
            [class.bg-white/10]="themeService.currentTheme() === theme.id"
            [class.text-white]="themeService.currentTheme() === theme.id"
            [class.text-slate-300]="themeService.currentTheme() !== theme.id"
            [class.hover:bg-white/5]="themeService.currentTheme() !== theme.id"
            role="menuitem"
          >
            <div class="flex items-center space-x-3">
              <span class="text-xl transform group-hover:scale-115 transition-transform duration-200">
                {{ theme.icon }}
              </span>
              <div>
                <p class="font-semibold text-white group-hover:text-cv-accent transition-colors">
                  {{ 'themes_data.' + theme.id + '.title' | translate }}
                </p>
                <p class="text-[11px] text-slate-400 group-hover:text-slate-300 truncate max-w-[180px]">
                  {{ 'themes_data.' + theme.id + '.description' | translate }}
                </p>
              </div>
            </div>
            
            @if (themeService.currentTheme() === theme.id) {
              <span class="text-xs font-bold text-cv-accent animate-pulse">●</span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
