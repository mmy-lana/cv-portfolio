<header class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 pb-8 border-b border-slate-800/80">
  <div class="flex items-center space-x-3 cursor-pointer" (click)="goHome()">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 font-black text-white flex items-center justify-center text-xs shadow-md">
      MY
    </div>
    <div>
      <span class="font-black text-white tracking-tight text-base block leading-none">mmylana</span>
      <span class="text-[10px] text-slate-400 font-medium">Muhammad Maulana Yusuf</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    @if (showHomeButton()) {
      <button 
        (click)="goHome()" 
        class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-300 hover:text-white transition-colors cursor-pointer"
      >
        ← All Themes
      </button>
    }
    <app-theme-mode-toggle />
    <app-language-toggle />
    <app-download-cv-btn variant="primary" size="md" />
  </div>
</header>
