<!-- STICKY TOP TOOLBAR -->
<header class="sticky top-0 z-40 w-full backdrop-blur-md border-b transition-colors duration-200"
  [class.bg-slate-950/80]="themeService.isDarkMode()" [class.border-slate-800]="themeService.isDarkMode()"
  [class.text-white]="themeService.isDarkMode()" [class.bg-white/80]="!themeService.isDarkMode()"
  [class.border-slate-200]="!themeService.isDarkMode()" [class.text-slate-900]="!themeService.isDarkMode()">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

    <!-- LEFT: BACK TO THEMES & SECTION LINKS -->
    <div class="flex items-center space-x-4">
      <button (click)="goHome()"
        class="h-9 px-3.5 rounded-xl border text-xs font-bold flex items-center gap-2 transition-all cursor-pointer select-none"
        [class.border-slate-800]="themeService.isDarkMode()" [class.bg-slate-900]="themeService.isDarkMode()"
        [class.hover:bg-slate-800]="themeService.isDarkMode()" [class.text-slate-200]="themeService.isDarkMode()"
        [class.border-slate-200]="!themeService.isDarkMode()" [class.bg-slate-100]="!themeService.isDarkMode()"
        [class.hover:bg-slate-200]="!themeService.isDarkMode()" [class.text-slate-800]="!themeService.isDarkMode()">
        <app-cv-icon name="arrow-left" size="w-3.5 h-3.5" />
        <span>{{ 'actions.all_themes' | translate }}</span>
      </button>

      <!-- DESKTOP SECTION LINKS -->
      <nav class="hidden lg:flex items-center space-x-1 text-xs font-bold">
        @for (sec of sections; track sec.id) {
        <button (click)="scrollTo(sec.id)"
          class="px-2.5 py-1.5 rounded-lg opacity-75 hover:opacity-100 transition-opacity cursor-pointer">
          {{ sec.label | translate }}
        </button>
        }
      </nav>
    </div>

    <!-- RIGHT: CONTROLS -->
    <div class="hidden md:flex items-center space-x-2.5">
      <app-theme-selector position="down" align="right" />
      <app-theme-mode-toggle />
      <app-language-toggle />
    </div>

    <!-- MOBILE HAMBURGER MENU -->
    <div class="md:hidden flex items-center space-x-2">
      <app-theme-mode-toggle />
      <button (click)="toggleMenu()"
        class="p-2 rounded-xl border min-h-11 min-w-11 flex items-center justify-center cursor-pointer"
        [class.border-slate-800]="themeService.isDarkMode()" [class.bg-slate-900]="themeService.isDarkMode()"
        [class.border-slate-200]="!themeService.isDarkMode()" [class.bg-slate-100]="!themeService.isDarkMode()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="menuOpen()">
        <app-cv-icon [name]="menuOpen() ? 'close' : 'menu'" size="w-5 h-5" />
      </button>
    </div>
  </div>
</header>

<!-- MOBILE SLIDE-OUT DRAWER -->
@if (menuOpen()) {
<div
  class="md:hidden fixed inset-x-0 top-16 bottom-0 z-50 p-4 sm:p-6 space-y-5 flex flex-col justify-between overflow-y-auto overscroll-contain h-[calc(100dvh-4rem)] max-h-[calc(100dvh-4rem)] pb-[max(1.5rem,env(safe-area-inset-bottom))] backdrop-blur-xl transition-all animate-fade-in-up scrollbar-none"
  [class.bg-slate-950/95]="themeService.isDarkMode()" [class.text-white]="themeService.isDarkMode()"
  [class.bg-white/95]="!themeService.isDarkMode()" [class.text-slate-900]="!themeService.isDarkMode()">
  <div class="space-y-3">
    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 border-b pb-1.5"
      [class.border-slate-800]="themeService.isDarkMode()" [class.border-slate-200]="!themeService.isDarkMode()">
      SECTION JUMPS
    </div>
    <div class="grid grid-cols-2 gap-2">
      @for (sec of sections; track sec.id) {
      <button (click)="scrollTo(sec.id)"
        class="w-full text-left px-3 py-2 rounded-xl font-bold text-xs sm:text-sm border transition-colors cursor-pointer min-h-11 flex items-center justify-between"
        [class.border-slate-800]="themeService.isDarkMode()" [class.bg-slate-900/60]="themeService.isDarkMode()"
        [class.border-slate-200]="!themeService.isDarkMode()" [class.bg-slate-50]="!themeService.isDarkMode()">
        <span class="truncate">{{ sec.label | translate }}</span>
        <app-cv-icon name="arrow-right" size="w-3 h-3" class="opacity-50 shrink-0 ml-1" />
      </button>
      }
    </div>
  </div>

<div class="space-y-4 pt-4 border-t" [class.border-slate-800]="themeService.isDarkMode()" [class.border-slate-200]="!themeService.isDarkMode()">
    <!-- MOBILE DRAWER ECOSYSTEM LINKS -->
    <div class="space-y-2">
      <div class="text-xs font-bold uppercase tracking-wider text-slate-400">
        {{ 'ecosystem.title' | translate }}
      </div>
      <div class="grid grid-cols-1 gap-2">
        <a href="https://portfolio.mmylana.my.id" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-between p-3 rounded-xl border text-xs font-bold transition-all min-h-11"
          [class.bg-amber-950/30]="themeService.isDarkMode()"
          [class.border-amber-800/40]="themeService.isDarkMode()"
          [class.text-amber-300]="themeService.isDarkMode()"
          [class.bg-amber-50]="!themeService.isDarkMode()"
          [class.border-amber-200]="!themeService.isDarkMode()"
          [class.text-amber-800]="!themeService.isDarkMode()"
        >
          <div class="flex items-center space-x-2.5">
            <app-cv-icon name="rocket" size="w-4 h-4" />
            <span>110+ Interactive Projects Catalog</span>
          </div>
          <app-cv-icon name="external-link" size="w-3.5 h-3.5" />
        </a>

        <a href="https://underthehood.mmylana.my.id" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-between p-3 rounded-xl border text-xs font-bold transition-all min-h-11"
          [class.bg-emerald-950/30]="themeService.isDarkMode()"
          [class.border-emerald-800/40]="themeService.isDarkMode()"
          [class.text-emerald-300]="themeService.isDarkMode()"
          [class.bg-emerald-50]="!themeService.isDarkMode()"
          [class.border-emerald-200]="!themeService.isDarkMode()"
          [class.text-emerald-800]="!themeService.isDarkMode()"
        >
          <div class="flex items-center space-x-2.5">
            <app-cv-icon name="book-open" size="w-4 h-4" />
            <span>Under The Hood (285+ Topics)</span>
          </div>
          <app-cv-icon name="external-link" size="w-3.5 h-3.5" />
        </a>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-400">LANGUAGE</span>
      <app-language-toggle position="up" />
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-400">THEME PRESET</span>
      <app-theme-selector position="up" align="right" />
    </div>
    <div class="pt-2">
      <app-download-cv-btn variant="primary" size="lg" class="w-full" />
    </div>
  </div>
</div>
}

<!-- FLOATING SCROLL TO TOP BUTTON -->
@if (showScrollTop()) {
<button (click)="scrollToTop()"
  class="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-black shadow-2xl flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 z-50 cursor-pointer"
  aria-label="Scroll to top">
  <app-cv-icon name="arrow-up" size="w-5 h-5" />
</button>
}
