name: Portfolio Quality & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_smoke:
        description: 'Also run the E2E accessibility suite against the deployed production site'
        type: boolean
        default: false

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (supply-chain hardening).
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Build the code under review; a broken build fails the job here.
      - name: Build Production Application
        run: npm run build

      # Existing unit-test suite (Vitest/jsdom) against the code under review.
      - name: Run Unit Tests
        run: npm test -- --watch=false

      # WCAG accessibility suite against the locally built artifact served by
      # e2e/serve-dist.mjs (see playwright.config.ts). Fails the job on any violation.
      - name: Run Playwright WCAG Accessibility Tests (local build)
        run: npm run test:e2e

      # Audits the production build artifact served from dist/ (lighthouserc.json
      # staticDistDir), not the deployed site, so PR changes are performance-gated
      # against their own build output. numberOfRuns=3 for metric stability.
      - name: Run Lighthouse CI Performance & Core Web Vitals (local build)
        run: npm run test:lighthouse

      # Opt-in production smoke test (manual dispatch only). Kept explicit so routine CI
      # validates the code under review instead of the deployed site.
      - name: Run Playwright Accessibility Tests against Production (opt-in smoke)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_smoke }}
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://www.mmylana.my.id
